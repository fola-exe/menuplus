<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Management | MenuPlus Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin-menu.css">
</head>
<body>

  <div class="page-wrapper">

    <!-- Top nav -->
    <header class="topbar">
      <div class="topbar__brand">
        <img src="../assets/logo-icon.jpg" alt="MenuPlus logo" class="topbar__icon-img">
        <span class="topbar__name">menu<span class="topbar__name-accent">plus</span></span>
        <span class="topbar__badge">Admin</span>
      </div>
      <div class="topbar__user">
        <span class="user-avatar">J</span>
        <span class="user-name">James A.</span>
        <a href="admin-login.html" class="logout-link">Log out</a>
      </div>
    </header>

    <main class="content">

      <!-- Page header -->
      <div class="page-header">
        <div>
          <h1>Menu Management</h1>
          <p>Create, edit, or disable menu items. Manage categories, pricing, and availability.</p>
        </div>
        <button type="button" class="btn-primary" id="add-item-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          Add item
        </button>
      </div>

      <!-- Category filters -->
      <div class="category-filter">
        <button type="button" class="filter-btn is-active" data-category="all">All</button>
        <button type="button" class="filter-btn" data-category="mains">Mains</button>
        <button type="button" class="filter-btn" data-category="sides">Sides</button>
        <button type="button" class="filter-btn" data-category="drinks">Drinks</button>
        <button type="button" class="filter-btn" data-category="desserts">Desserts</button>
      </div>

      <!-- Item grid -->
      <div class="item-grid" id="item-grid">
        <!-- Populated by JavaScript -->
      </div>

    </main>

  </div>

  <!-- Modal for Create/Edit -->
  <div class="modal" id="item-modal" hidden>
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title">Add item</h2>
        <button type="button" class="modal-close" aria-label="Close">×</button>
      </div>

      <form class="item-form" id="item-form" novalidate>
        <div class="form-row form-row--split">
          <div class="field-group">
            <label for="item-name">Item name</label>
            <input type="text" id="item-name" name="name" placeholder="e.g., Jollof Rice & Grilled Chicken" required>
          </div>

          <div class="field-group">
            <label for="item-price">Price (₦)</label>
            <input type="number" id="item-price" name="price" placeholder="4500" min="0" required>
          </div>
        </div>

        <div class="field-group">
          <label for="item-category">Category</label>
          <select id="item-category" name="category" required>
            <option value="">Select a category</option>
            <option value="mains">Mains</option>
            <option value="sides">Sides</option>
            <option value="drinks">Drinks</option>
            <option value="desserts">Desserts</option>
          </select>
        </div>

        <div class="field-group">
          <label for="item-description">Description</label>
          <textarea id="item-description" name="description" placeholder="Brief description of the item..." rows="3"></textarea>
        </div>

        <div class="field-group field-group--checkbox">
          <input type="checkbox" id="item-available" name="available" checked>
          <label for="item-available">Available</label>
        </div>

        <div class="form-actions">
          <button type="button" class="btn-secondary" id="modal-cancel">Cancel</button>
          <button type="submit" class="btn-primary">Save item</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    /* ================================================================
       PLACEHOLDER MENU MANAGEMENT LOGIC
       ----------------------------------------------------------------
       This simulates CRUD operations entirely in the browser using
       localStorage. In a real app, these would call backend API
       endpoints to persist data to a database.
       ================================================================ */

    const MENU_STORAGE_KEY = 'adminMenuItems';

    // Sample menu items
    const defaultItems = [
      { id: 1, name: 'Jollof Rice & Grilled Chicken', category: 'mains', price: 4500, description: 'Smoky party-style jollof rice with herb-marinated grilled chicken thigh.', available: true },
      { id: 2, name: 'Fried Rice & Beef Suya Skewers', category: 'mains', price: 4200, description: 'Vegetable fried rice paired with two spiced beef suya skewers.', available: true },
      { id: 3, name: 'Pounded Yam & Egusi Soup', category: 'mains', price: 5000, description: 'Smooth pounded yam with rich egusi soup, assorted meat & fish.', available: true },
      { id: 4, name: 'Plantain (Dodo)', category: 'sides', price: 1200, description: 'Sweet fried ripe plantain slices.', available: true },
      { id: 5, name: 'Coleslaw', category: 'sides', price: 1000, description: 'Crisp cabbage & carrot slaw in a light creamy dressing.', available: true },
      { id: 6, name: 'Chapman (Jug)', category: 'drinks', price: 3500, description: 'Classic Nigerian Chapman cocktail, serves approx. 6 guests.', available: true },
      { id: 7, name: 'Soft Drinks (Crate)', category: 'drinks', price: 6000, description: 'Assorted bottled soft drinks, 24 pieces per crate.', available: true },
      { id: 8, name: 'Chocolate Fountain (Small)', category: 'desserts', price: 15000, description: 'Mini chocolate fountain with skewers, marshmallows & fruit for dipping.', available: true },
      { id: 9, name: 'Assorted Mini Pastries (Tray)', category: 'desserts', price: 8000, description: 'Bite-sized puff puff, meat pies & sausage rolls, 40 pieces per tray.', available: true },
    ];

    let items = loadItems();
    let currentFilter = 'all';
    let editingId = null;

    function loadItems() {
      const stored = localStorage.getItem(MENU_STORAGE_KEY);
      return stored ? JSON.parse(stored) : defaultItems;
    }

    function saveItems() {
      localStorage.setItem(MENU_STORAGE_KEY, JSON.stringify(items));
    }

    function getNextId() {
      return items.length > 0 ? Math.max(...items.map(i => i.id)) + 1 : 1;
    }

    function renderItems() {
      const grid = document.getElementById('item-grid');
      const filtered = currentFilter === 'all' ? items : items.filter(i => i.category === currentFilter);

      grid.innerHTML = filtered.map(item => `
        <article class="item-card" data-id="${item.id}">
          <div class="item-card__header">
            <h3>${item.name}</h3>
            <div class="item-card__actions">
              <button type="button" class="action-btn action-btn--edit" aria-label="Edit item" data-id="${item.id}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                </svg>
              </button>
              <button type="button" class="action-btn action-btn--delete" aria-label="Delete item" data-id="${item.id}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="item-card__meta">
            <span class="item-card__category">${item.category}</span>
            <span class="item-card__price">₦${item.price.toLocaleString('en-NG')}</span>
          </div>

          <p class="item-card__description">${item.description}</p>

          <div class="item-card__footer">
            <label class="toggle-switch">
              <input type="checkbox" class="availability-toggle" ${item.available ? 'checked' : ''} data-id="${item.id}">
              <span class="toggle-switch__slider"></span>
              <span class="toggle-switch__label">${item.available ? 'Available' : 'Unavailable'}</span>
            </label>
          </div>
        </article>
      `).join('');

      // Attach event listeners
      grid.querySelectorAll('.action-btn--edit').forEach(btn => {
        btn.addEventListener('click', () => openEditModal(parseInt(btn.dataset.id)));
      });

      grid.querySelectorAll('.action-btn--delete').forEach(btn => {
        btn.addEventListener('click', () => deleteItem(parseInt(btn.dataset.id)));
      });

      grid.querySelectorAll('.availability-toggle').forEach(toggle => {
        toggle.addEventListener('change', () => toggleAvailability(parseInt(toggle.dataset.id)));
      });
    }

    function openEditModal(id) {
      editingId = id;
      const item = items.find(i => i.id === id);
      
      document.getElementById('modal-title').textContent = 'Edit item';
      document.getElementById('item-name').value = item.name;
      document.getElementById('item-price').value = item.price;
      document.getElementById('item-category').value = item.category;
      document.getElementById('item-description').value = item.description;
      document.getElementById('item-available').checked = item.available;

      document.getElementById('item-modal').hidden = false;
    }

    function openCreateModal() {
      editingId = null;
      document.getElementById('modal-title').textContent = 'Add item';
      document.getElementById('item-form').reset();
      document.getElementById('item-available').checked = true;
      document.getElementById('item-modal').hidden = false;
    }

    function closeModal() {
      document.getElementById('item-modal').hidden = true;
      editingId = null;
    }

    function saveItem(formData) {
      if (editingId) {
        // Update existing
        const item = items.find(i => i.id === editingId);
        item.name = formData.name;
        item.price = parseInt(formData.price, 10);
        item.category = formData.category;
        item.description = formData.description;
        item.available = formData.available;
      } else {
        // Create new
        items.push({
          id: getNextId(),
          name: formData.name,
          price: parseInt(formData.price, 10),
          category: formData.category,
          description: formData.description,
          available: formData.available,
        });
      }

      saveItems();
      renderItems();
      closeModal();
    }

    function deleteItem(id) {
      if (confirm('Are you sure you want to delete this item?')) {
        items = items.filter(i => i.id !== id);
        saveItems();
        renderItems();
      }
    }

    function toggleAvailability(id) {
      const item = items.find(i => i.id === id);
      item.available = !item.available;
      saveItems();
      renderItems();
    }

    // Event listeners
    document.getElementById('add-item-btn').addEventListener('click', openCreateModal);
    document.querySelector('.modal-close').addEventListener('click', closeModal);
    document.getElementById('modal-cancel').addEventListener('click', closeModal);

    document.getElementById('item-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      saveItem({
        name: formData.get('name'),
        price: formData.get('price'),
        category: formData.get('category'),
        description: formData.get('description'),
        available: formData.get('available') === 'on',
      });
    });

    // Category filter
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('is-active'));
        btn.classList.add('is-active');
        currentFilter = btn.dataset.category;
        renderItems();
      });
    });

    // Close modal on background click
    document.getElementById('item-modal').addEventListener('click', (e) => {
      if (e.target.id === 'item-modal') closeModal();
    });

    // Initial render
    renderItems();
  </script>

</body>
</html>
